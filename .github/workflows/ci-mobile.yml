name: Validate phone app
# Only when a pull request changes the phone app (or this file), once per pull request.
on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/ci-mobile.yml"]
  workflow_dispatch:
concurrency:
  group: validate-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo export --platform android --platform ios
