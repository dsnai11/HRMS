name: Validate HRMS
# Once per pull request (GitHub tests the result of merging it), not on every push as well:
# the repository is private and Actions minutes are limited. A newer push to the same pull
# request cancels the run still going. Run by hand from the Actions tab when needed.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check public/app.js
